name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wuhb:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: |
          git config --global --add safe.directory '*'
          make -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: WiiUStation
          path: |
            WiiUStation.wuhb
            WiiUStation.rpx
