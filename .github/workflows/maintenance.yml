name: Maintenance

# temporary: sets the text of release v1.0.6 and removes the old workflow runs
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release text
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v1.0.6 --title "WiiUStation v1.0.6" --notes-file .github/notes/v1.0.6.md
      - name: Old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs?per_page=100" --jq '.workflow_runs[].id' |
          while read id; do
            [ "$id" = "${{ github.run_id }}" ] && continue
            gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" && echo "deleted $id" || echo "kept $id"
          done
