name: Maintenance

# temporary: keeps only the English text of release v1.0.6 and removes older workflow runs
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Release text
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.0.6 --json body --jq .body > body.md
          # everything before the "---" line (the English part)
          awk '/^---[[:space:]]*$/{exit} {print}' body.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > en.md
          cat en.md
          gh release edit v1.0.6 --notes-file en.md
      - name: Old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs?per_page=100" --jq '.workflow_runs[].id' |
          while read id; do
            [ "$id" = "${{ github.run_id }}" ] && continue
            gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" && echo "deleted $id" || echo "kept $id"
          done
